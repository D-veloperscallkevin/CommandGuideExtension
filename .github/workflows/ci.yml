name: CI

on:
  pull_request:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix webview-ui

      - name: Typecheck and lint
        run: |
          npm run check-types
          npm run lint
          npm run lint:webview

      - name: Unit tests
        run: npm run test:unit

      - name: Production build (extension + webview)
        run: npm run package

      - name: Cache VS Code test install
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs', 'package-lock.json') }}
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Integration tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm test

  # Único check obligatorio del ruleset: estable aunque cambie la matriz.
  # if: always() hace que falle (y no quede "skipped") cuando checks falla o se cancela.
  ci-ok:
    name: ci-ok
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: test "${{ needs.checks.result }}" = "success"
